repos:
  - repo: local
    hooks:
      - id: go-format
        name: gofmt
        entry: gofmt -w
        language: system
        files: ^core/.*\.go$
        exclude: ^core/Clash.Meta/
      - id: native-domain-tests
        name: native domain regressions
        entry: dotnet run --project windows-native/FClash.Tests -c Release
        language: system
        pass_filenames: false
        files: ^windows-native/FClash.Domain/.*\.cs$
