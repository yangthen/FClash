name: Native packages
on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.4', cache-dependency-path: core/go.sum}
      - run: dotnet run --project windows-native/FClash.Tests -c Release
      - shell: pwsh
        run: |
          $label = (ConvertFrom-StringData (Get-Content version.properties -Raw)).label + '-native-preview'
          ./scripts/build_windows_native.ps1 -Architecture x64 -Label $label -Targets 'exe,zip'
      - uses: actions/upload-artifact@v4
        with: {name: FClash-windows-native, path: dist/windows-native/}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.4', cache-dependency-path: core/go.sum}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: chmod +x android/gradlew
      - name: Configure existing FClash release signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          keytool -exportcert -keystore android/app/keystore.jks -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/fclash-cert.der"
          test "$(sha256sum "$RUNNER_TEMP/fclash-cert.der" | cut -d ' ' -f1)" = '3031c1bfd3f384b9858284b5c5b7ab61fc68763e552558878b5df2e734af63a4'
          python3 - <<'PYCODE'
          import os, pathlib
          def escaped(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile':'keystore.jks', 'storePassword':os.environ['STORE_PASSWORD'], 'keyAlias':os.environ['KEY_ALIAS'], 'keyPassword':os.environ['KEY_PASSWORD']}
          pathlib.Path('android/key.properties').write_text('\n'.join(k+'='+escaped(v) for k,v in values.items()))
          PYCODE
      - run: python3 scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with: {name: FClash-android-native, path: dist/android-native/}
